[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "durshift"
version = "0.1.0"
description = "Treasury buybacks, dealer pressure, and duration redistribution research scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "pandas>=2.2",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
scrape = [
    "playwright>=1.40",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "playwright>=1.40",
]

[project.scripts]
durshift = "durshift.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
